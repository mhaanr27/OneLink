<!DOCTYPE html>
<html>
<head>
    <title>Register - OneLink</title>
</head>

<body>

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="username"
            placeholder="Username"
            required
        >
        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >
        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >
        <br><br>

        <button type="submit">Create Account</button>

    </form>

    <p id="message"></p>

    <script src="/js/auth.js"></script>

</body>
</html>
